<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EDE9FE" />
    </linearGradient>

    <!-- Coin / Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DDD6FE" />
      <stop offset="100%" stop-color="#C4B5FD" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4C1D95" flood-opacity="0.35" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Shadow -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bgGrad)" filter="url(#softShadow)" />

  <!-- Inner Soft Border -->
  <rect x="36" y="36" width="440" height="440" rx="104" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="4" />

  <!-- Wallet Body Shape -->
  <g transform="translate(106, 136)">
    <!-- Main Wallet Pocket -->
    <rect x="0" y="40" width="300" height="200" rx="36" fill="url(#cardGrad)" filter="url(#softShadow)" />
    
    <!-- Wallet Flap / Front Accent -->
    <path d="M 0,90 Q 150,130 300,90 L 300,204 Q 300,240 264,240 L 36,240 Q 0,240 0,204 Z" fill="#FAF9FF" />

    <!-- Wallet Clasp / Badge -->
    <rect x="220" y="112" width="68" height="56" rx="20" fill="url(#bgGrad)" />
    <circle cx="254" cy="140" r="10" fill="#FFFFFF" />

    <!-- Card Sticking Out of Wallet -->
    <rect x="40" y="0" width="220" height="70" rx="16" fill="url(#accentGrad)" opacity="0.9" />
    <rect x="60" y="16" width="80" height="12" rx="6" fill="#7C3AED" opacity="0.6" />

    <!-- Indonesian Rupiah Motif / Sparkle -->
    <g transform="translate(60, 130)">
      <!-- Sparkle Star -->
      <path d="M 30,0 Q 30,30 60,30 Q 30,30 30,60 Q 30,30 0,30 Q 30,30 30,0 Z" fill="#7C3AED" />
      <!-- Small secondary star -->
      <path d="M 85,20 Q 85,35 100,35 Q 85,35 85,50 Q 85,35 70,35 Q 85,35 85,20 Z" fill="#A78BFA" opacity="0.8" />
    </g>
  </g>
</svg>
